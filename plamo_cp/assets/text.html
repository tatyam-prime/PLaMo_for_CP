<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLaMo for CP — テキスト対訳</title>
  <style>
    :root{font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203244;background:#f4f6f9;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px 12px;background:white;border-bottom:1px solid #dce3ea}.heading,.controls,.pane-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:12px}h1{font-size:21px;margin:0}h2{font-size:14px;margin:0}a{color:#315fce}label{font-size:12px;color:#637586}button,select,input{font:inherit;font-size:13px;border:1px solid #bdcbd8;border-radius:6px;padding:6px 10px;background:white;color:#294d70}button{cursor:pointer;font-weight:600}button.primary{background:#315fce;border-color:#315fce;color:white}button:disabled{opacity:.45;cursor:default}input[type=number]{width:65px}.help{font-size:12px;color:#637586;margin:7px 0 0}.status{margin:12px 24px 0;min-height:24px}.error{color:#a13b31}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 24px;height:calc(100vh - 230px);min-height:430px}.pane{display:flex;flex-direction:column;min-width:0;background:white;border:1px solid #dce3ea;border-radius:9px;overflow:hidden}.pane-heading{justify-content:space-between;border-bottom:1px solid #e4e9ef;padding:9px 14px}textarea{flex:1;min-height:360px;resize:none;outline:none;border:0;padding:16px;font:inherit;line-height:1.8;background:white;color:inherit;width:100%}.results{overflow:auto;flex:1;padding:4px 16px}.paragraph{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 18px}.draft{color:#526b85}.pending,.empty{color:#8190a0}.empty{margin:18px 0}.failed{color:#8c5544}footer{font-size:11px;color:#718393;margin:0 24px 16px}progress{width:100px;height:6px;accent-color:#315fce}[hidden]{display:none!important}@media(max-width:750px){header{padding:14px 16px}.workspace{grid-template-columns:1fr;height:auto;margin:12px 16px}.pane{min-height:340px;max-height:65vh}textarea{min-height:300px}.status,footer{margin-left:16px;margin-right:16px}}
  </style>
  <script src="/translation-jobs.js" defer></script><script src="/text.js" defer></script>
</head>
<body>
<header>
  <div class="heading"><h1>テキスト対訳</h1><a href="/" target="_blank" rel="noopener">設定・管理 ↗</a></div>
  <div class="controls">
    <label>モデル <select id="model" disabled><option value="0.8b">800M（0.8B）</option><option value="2b" selected>2B</option><option value="8b">8B</option></select></label>
    <label>同時に翻訳する段落数 <input id="prefetch" type="number" min="1" max="16" step="1" value="4" disabled></label>
    <label>原文の言語 <select id="source-language"><option value="English">英語</option><option value="Chinese">中国語</option><option value="Indonesian">インドネシア語</option><option value="auto">自動判定</option></select></label>
    <label>文書 <select id="document-type"><option value="problem">競プロの問題文</option><option value="general">一般文書</option></select></label>
    <button id="translate" class="primary" disabled>翻訳</button><button id="stop" hidden>停止</button><progress id="progress" hidden></progress>
  </div>
  <p id="model-info" class="help">モデルを確認しています…</p>
</header>
<div id="status" class="status" role="status" aria-live="polite">原文を貼り付けて「翻訳」を押してください。</div>
<main class="workspace">
  <section class="pane" aria-label="原文"><div class="pane-heading"><label for="source"><h2>原文</h2></label><button id="clear">クリア</button></div><textarea id="source" maxlength="300000" spellcheck="false" placeholder="翻訳したい文章を貼り付けてください。"></textarea></section>
  <section class="pane" aria-label="日本語訳"><div class="pane-heading"><h2>日本語訳</h2><button id="copy" disabled>訳文をコピー</button></div><div id="results" class="results"><p class="empty">訳文がここに表示されます。</p></div></section>
</main>
<footer>Translated by PLaMo · 訳文には誤りが含まれることがあります。原文と見比べて確認してください。 <a href="https://plamo.preferredai.jp/info/plamo-community-license-ja" target="_blank" rel="noopener">モデルの利用条件</a></footer>
</body>
</html>
